version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: postgres_db

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: gradit_db
      POSTGRES_USER:         
      POSTGRES_PASSWORD: gradit

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: always

volumes:
  postgres_data:



